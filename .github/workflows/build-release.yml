name: Build and release H1 FC

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python tools/verify_release.py --check-tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install pinned dependencies and GNU MIPS toolchain
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/install_toolchain.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and package
        run: |
          python tests/release_contract_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/build.py --toolchain .tools/toolchain/bin
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/package.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/verify_release.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Execute actual release MIPS code with H1 service mocks
        run: |
          python tests/mips_smoke.py --bda dist/H1FC.bda --menu
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/pause_menu_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/default_skip_smoke.py --bda dist/H1FC.bda
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/build.py --test-frames 20 --toolchain .tools/toolchain/bin
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/audio_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/ppu_skip_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/options_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/check_icon.py --zip dist/H1FC-install.zip --output build/verification/icon-verification.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check reproducible BDA and installer
        run: |
          $firstBda = (Get-FileHash dist/H1FC.bda -Algorithm SHA256).Hash
          $firstZip = (Get-FileHash dist/H1FC-install.zip -Algorithm SHA256).Hash
          python tools/build.py --toolchain .tools/toolchain/bin
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/package.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-FileHash dist/H1FC.bda -Algorithm SHA256).Hash -ne $firstBda) { throw 'BDA is not reproducible' }
          if ((Get-FileHash dist/H1FC-install.zip -Algorithm SHA256).Hash -ne $firstZip) { throw 'Install ZIP is not reproducible' }
      - name: Validate JIT backend independently
        run: |
          python tools/build.py --native-jit --toolchain .tools/toolchain/bin
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/jit_smoke.py --bda dist/H1FC-jit.bda --elf build/release-jit/H1FC.elf --nm .tools/toolchain/bin/mipsel-none-elf-nm.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/jit_backoff_smoke.py --bda dist/H1FC-jit.bda --elf build/release-jit/H1FC.elf --nm .tools/toolchain/bin/mipsel-none-elf-nm.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/jit_event_smoke.py --bda dist/H1FC-jit.bda --elf build/release-jit/H1FC.elf --nm .tools/toolchain/bin/mipsel-none-elf-nm.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/jit_schedule_smoke.py --bda dist/H1FC-jit.bda --elf build/release-jit/H1FC.elf --nm .tools/toolchain/bin/mipsel-none-elf-nm.exe --output build/verification/jit-schedule.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/jit_schedule_scope_smoke.py --bda dist/H1FC-jit.bda --elf build/release-jit/H1FC.elf --nm .tools/toolchain/bin/mipsel-none-elf-nm.exe --output build/verification/jit-schedule-scope.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/jit_combined_clock_smoke.py --bda dist/H1FC-jit.bda --elf build/release-jit/H1FC.elf --nm .tools/toolchain/bin/mipsel-none-elf-nm.exe --output build/verification/jit-combined-clock.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/jit_addressing_smoke.py --bda dist/H1FC-jit.bda --elf build/release-jit/H1FC.elf --nm .tools/toolchain/bin/mipsel-none-elf-nm.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/jit_run_smoke.py --bda dist/H1FC-jit.bda --elf build/release-jit/H1FC.elf --nm .tools/toolchain/bin/mipsel-none-elf-nm.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/jit_run_state_smoke.py --bda dist/H1FC-jit.bda --elf build/release-jit/H1FC.elf --nm .tools/toolchain/bin/mipsel-none-elf-nm.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/jit_contract_smoke.py --bda dist/H1FC-jit.bda --elf build/release-jit/H1FC.elf --nm .tools/toolchain/bin/mipsel-none-elf-nm.exe --output build/verification/jit-contract.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/jit_nested_contract_smoke.py --bda dist/H1FC-jit.bda --elf build/release-jit/H1FC.elf --nm .tools/toolchain/bin/mipsel-none-elf-nm.exe --output build/verification/jit-nested-contract.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/jit_arena_nested_smoke.py --bda dist/H1FC-jit.bda --elf build/release-jit/H1FC.elf --nm .tools/toolchain/bin/mipsel-none-elf-nm.exe --cache-mib 8 --output build/verification/jit-arena-nested.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/jit_ppu_contract_smoke.py --bda dist/H1FC-jit.bda --elf build/release-jit/H1FC.elf --nm .tools/toolchain/bin/mipsel-none-elf-nm.exe --output build/verification/jit-ppu-contract.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/jit_bank_cache_smoke.py --bda dist/H1FC-jit.bda --elf build/release-jit/H1FC.elf --nm .tools/toolchain/bin/mipsel-none-elf-nm.exe --expect-cache-mib 8 --output build/verification/jit-bank-8m.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/build.py --native-jit --jit-cache-mib 4 --no-dist --toolchain .tools/toolchain/bin
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/jit_bank_cache_smoke.py --bda build/release-jit-4m/H1FC.bda --elf build/release-jit-4m/H1FC.elf --nm .tools/toolchain/bin/mipsel-none-elf-nm.exe --expect-cache-mib 4 --output build/verification/jit-bank-4m.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/jit_arena_nested_smoke.py --bda build/release-jit-4m/H1FC.bda --elf build/release-jit-4m/H1FC.elf --nm .tools/toolchain/bin/mipsel-none-elf-nm.exe --cache-mib 4 --output build/verification/jit-arena-nested-4m.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/build.py --native-jit --jit-cache-mib 1 --no-dist --toolchain .tools/toolchain/bin
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/jit_bank_cache_smoke.py --bda build/release-jit-1m/H1FC.bda --elf build/release-jit-1m/H1FC.elf --nm .tools/toolchain/bin/mipsel-none-elf-nm.exe --expect-cache-mib 1 --output build/verification/jit-bank-1m.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/core_equivalence.py --baseline-bda dist/H1FC.bda --baseline-elf build/release/H1FC.elf --bda dist/H1FC-jit.bda --elf build/release-jit/H1FC.elf --nm .tools/toolchain/bin/mipsel-none-elf-nm.exe --frames 24 --sprites --require-jit --cost-census --output build/verification/jit-ci-equivalence.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/mips_smoke.py --bda dist/H1FC-jit.bda --menu --quick --output-dir build/verification/native
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/default_skip_smoke.py --bda dist/H1FC-jit.bda --output build/verification/default-skip-jit.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/exit_key_smoke.py --bda dist/H1FC-jit.bda --map build/release-jit/H1FC.map
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/save_audio_smoke.py --bda dist/H1FC-jit.bda --map build/release-jit/H1FC.map
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/jit_app_storage_policy_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/core_equivalence.py --baseline-bda dist/H1FC.bda --baseline-elf build/release/H1FC.elf --bda dist/H1FC-jit.bda --elf build/release-jit/H1FC.elf --nm .tools/toolchain/bin/mipsel-none-elf-nm.exe --frames 16 --sprites --dmc --require-jit --output build/verification/jit-dmc-ci.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/build.py --native-jit --test-frames 20 --toolchain .tools/toolchain/bin
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/jit_app_benchmark.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/package.py --jit
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package installer, complete source and checksums
        env:
          BUILD_REF: ${{ github.ref }}
          BUILD_REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:BUILD_REF.StartsWith('refs/tags/')) {
            python tools/package_release.py --tag "$env:BUILD_REF_NAME"
          } else {
            python tools/package_release.py
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: H1-FC-release
          path: dist/release/*
          archive: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: H1-FC-mips-tests
          path: build/verification/*
          archive: true
          if-no-files-found: warn
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: H1-FC-release
          path: dist/release
          digest-mismatch: error
      - name: Verify downloaded files and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python tools/package_release.py --verify --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
          gh release create "$RELEASE_TAG" dist/release/* --verify-tag --prerelease --title "NES $RELEASE_TAG" --notes-file dist/release/RELEASE-NOTES.md
